
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Icons</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Inline SVG Icons</h1>

    <div class="icon-container">

        <div class="icon-box home">
            <svg viewBox="0 0 24 24" aria-label="Home">
                <path d="M3 10 L12 3 L21 10 V21 H14 V14 H10 V21 H3 Z"/>
            </svg>
            <p>Home</p>
        </div>

        <div class="icon-box user">
            <svg viewBox="0 0 24 24" aria-label="User">
                <circle cx="12" cy="8" r="4"/>
                <path d="M4 21 C4 14 20 14 20 21"/>
            </svg>
            <p>User</p>
        </div>

        <div class="icon-box heart">
            <svg viewBox="0 0 24 24" aria-label="Heart">
                <path d="M12 21 C10 19 3 13 3 8
                C3 2 10 1 12 7
                C14 1 21 2 21 8
                C21 13 14 19 12 21 Z"/>
            </svg>
            <p>Heart</p>
        </div>

    </div>

</body>
</html>
